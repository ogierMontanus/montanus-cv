name: Monthly ORCID Sync

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - run: python scripts/sync_orcid.py

      - name: Check diff size
        id: diffsize
        run: |
          LINES=$(git diff --stat data/publications.yaml 2>/dev/null | tail -1 | awk '{print $4+0}')
          echo "changed=$LINES" >> $GITHUB_OUTPUT

      - name: Commit if diff is small
        if: steps.diffsize.outputs.changed > 0 && steps.diffsize.outputs.changed < 20
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/orcid_cache.json data/publications.yaml
          git commit -m "chore: monthly ORCID sync"
          git push

      - name: Warn if large diff
        if: steps.diffsize.outputs.changed >= 20
        run: |
          echo "::warning::Large ORCID sync diff (${LINES} lines) — manual review required before committing."
