- orcid_put_code: null
  title: "Military Occupation under the Eyes of the Lord"
  subtitle: "Studies in Erfurt during the Thirty Years War"
  year: 2010
  type: "book"
  subtype: "monograph"
  place: "Göttingen"
  publisher: "Vandenhoeck & Ruprecht"
  series: "Forschungen zur Kirchen- und Dogmengeschichte"
  series_volume: 103
  pages: 395
  isbn: "978-3-525-56455-4"
  cover_image: "/assets/images/cover_phd-thesis.jpg"
  url_worldcat: "https://www.worldcat.org/oclc/641458665"
  url_publisher: "http://www.v-r.de/en/title-2-2/military_occupation_under_the_eyes_of_the_lord-1005647/"
  url_cadmus: "https://cadmus.eui.eu/entities/publication/f909c25a-0b4c-5854-8490-8baf388d3bdd"
  order_pdf: "/assets/pdf/Berg_Occupation_10_m_Bestellsch.pdf"
  description: >
    The study was defended as a Ph.D. thesis at the European University Institute in
    November 2008. Some content was since revised for the publication. My PhD thesis was
    published by a major German publisher (rank 2) and was reviewed in leading German and
    French journals, including <em>Annales. Histoire, Sciences Sociales</em>. For a list of
    recent references to the work in the English-language literature, see my profile on
    <a href="https://scholar.google.com/citations?user=qZkbF8cAAAAJ&amp;hl=en" target="_blank"
    rel="noopener">Google Scholar</a>.
  selected: true
  include_on_site: true
  reviews:
    - reviewer: "Bertrand Forclaz"
      venue: "Annales. Histoire, Sciences Sociales"
      volume: 71
      issue: 1
      year: 2016
      quote: >
        "With this work, H. Berg gives an original and important contribution not only to
        the studies on the perception and experience of war within the religious domain,
        but also to more encompassing debates in cultural and religious history, such as
        the relation between clerical religiosity and the 'popular' piety (the term is
        here exchanged with 'lay' piety) and the question of secularisation." (translated
        by H.B.)
    - reviewer: "Peter H. Wilson"
      venue: "Zeitschrift für Historische Forschung"
      volume: 39
      issue: 2
      year: 2012
      note: "author of Europe's Tragedy. A History of the Thirty Years War"
      quote: >
        "The book's greatest strength lies in the accurate reconstruction of the dynamic
        phases in the experience and memory of the Thirty Years War until the end of the
        17th century. [...] This study contributes significantly to a more thorough
        understanding of war experiences in the Lutheran area. One can only hope that it
        will be supplemented by an equally detailed study of the Catholic population."
        (translated by H.B.)
    - reviewer: "Alexander Schunka"
      venue: "Zeitschrift für Thüringische Geschichte"
      issue: 66
      year: 2012
      quote: >
        "The book can be read as a modern history of mentalities and knowledge during
        the Thirty Years War based on a cogent case. [...] It is, beyond doubt, of great
        value to local urban history and to regional history [...] even though the book
        is, strictly speaking, not a study of Erfurt but rather a study in Erfurt."
    - reviewer: "Michael Rohrschneider"
      venue: "Sehepunkte"
      issue: 10
      year: 2010
      url: "http://www.sehepunkte.de/2010/10/17928.html"
      quote: >
        "The merits of this work include the broad base of sources and literature,
        and the, from an overall view, successful attempt to bring various sources,
        research themes and approaches into harmony with each other."
  reviews_note: >
    Further reviews appeared in Jahrbuch für Erfurter Geschichte, vol. 7 (2012), by
    Uwe Jens Wandel, and in Francia-Recensio, vol. 3 (2012), by Jean-Luc Le Cam.

