  reviews:
  - reviewer: Lars Bukdahl
    venue: Weekendavisen
    quote: '"Den akademiske men ikke ulæselige antologi H.C. Andersen ved skrivebordet,
      som lige nåede at udkomme, inden de 13 millioner landede, handler om, hvordan
      man rent praktisk og teknisk læser Andersens manuskripter og – via en række
      opdagelser og læsninger af betydningsfulde oprindelser og forandringer – hvorfor
      man gør det, for nemlig at blive klog på, hvad og hvordan eventyrene betyder
      ved at blive klogere på, hvordan de er nået frem til at gøre det. Men også bare
      fordi det er satans fascinerende og diverterende i sig selv at følge genier
      i værkmæssig action. ... solide, manuskriptskelende læsninger ... Så kom ikke
      her og kald naturvidenskab videnskabeligere end tekstvidenskab!"

      '
